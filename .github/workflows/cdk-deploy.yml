name: CDK Deploy (manual)

# Deploys the GetTrainMate CDK stack on manual dispatch only.
# Runs from main only: the OIDC role GetTrainMateGitHubGrowth trusts
# refs/heads/main (a branch run fails AssumeRoleWithWebIdentity).
#
# DO NOT run this until the IAM grant in docs/growth/PARTNER-OUTREACH-INFRA.md
# (Deployment runbook) is attached to the OIDC role. The grant was attached
# Nov 21, 2026 (inline policy PartnerInboundDeploy on
# GetTrainMateGitHubGrowth) — deploys from main are expected to work.
# If a deploy fails on a missing permission, add exactly that action scoped
# to the same resources (see runbook) — do not widen to *.
#
# Inputs:
# - route53_hosted_zone_id: Route53 hosted zone ID for gettrainmate.com
#   (Route53 console -> Hosted zones). Empty = DNS records are skipped
#   (SES/S3/Lambda still deploy); supply it to create the MX/SPF/DMARC rows.
#
# SES note: the partners@ rule is added to the account's shared ACTIVE
# rule set INBOUND_MAIL (SES allows one active set per region; INBOUND_MAIL
# also routes mail for the other businesses). The workflow verifies
# INBOUND_MAIL is the active set and never activates another one.

on:
  workflow_dispatch:
    inputs:
      route53_hosted_zone_id:
        description: 'Route53 hosted zone ID for gettrainmate.com (empty = skip DNS records)'
        type: string
        default: ''
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: us-east-1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install CDK dependencies
        run: cd infra && npm install

      - name: Install Lambda dependencies
        # Each Node.js Lambda keeps its own package.json (infra/lambdas/*/).
        # Their node_modules are gitignored, so without this step esbuild
        # cannot resolve their imports and CDK bundling fails. Loop over all
        # of them so a future Lambda is covered too.
        run: |
          for dir in infra/lambdas/*/; do
            if [ -f "$dir/package.json" ]; then
              echo "Installing dependencies in $dir"
              (cd "$dir" && npm ci)
            fi
          done

      - name: Build CDK
        run: npm run infra:build

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish .NET API (CDK asset)
        # The main stack's ApiFunction code asset is apps/api/publish. It is
        # never committed, so synth fails without it (the pre-existing
        # cdk.yml synth failure on main). The canonical build script
        # publishes Release output to apps/api/publish, which CDK then
        # uploads as part of this stack update — including the PR #15 API
        # change that reads the inbound token from SSM at startup.
        run: |
          chmod +x build-optimized-lambda.sh
          ./build-optimized-lambda.sh
          ls -ld apps/api/publish

      - name: Configure AWS credentials (OIDC role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GROWTH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy CDK stack (partner outreach infra enabled)
        working-directory: infra
        run: |
          CTX="--context enablePartnerOutreachInfra=true"
          if [ -n "${{ inputs.route53_hosted_zone_id }}" ]; then
            CTX="$CTX --context route53HostedZoneId=${{ inputs.route53_hosted_zone_id }}"
          fi
          # A human explicitly dispatched this run; do not prompt for approvals.
          npx cdk deploy $CTX --require-approval never
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: us-east-1

      - name: Check the active SES receipt rule set
        # The partners@ rule lives in the account's shared ACTIVE set
        # INBOUND_MAIL (SES allows one active set per region; INBOUND_MAIL
        # also routes mail for the other businesses). The deploy must
        # never activate a different set. Fail loudly if INBOUND_MAIL is
        # not the active set.
        run: |
          set -uo pipefail
          ACTIVE=$(aws ses describe-active-receipt-rule-set --region "$AWS_REGION" \
            --query 'Metadata.Name' --output text 2>/dev/null || echo "NONE")
          echo "ACTIVE_RULE_SET=$ACTIVE"
          if [ "$ACTIVE" != "INBOUND_MAIL" ]; then
            echo "ERROR: the active SES receipt rule set is '$ACTIVE', not INBOUND_MAIL."
            echo "The partners@ rule lives in INBOUND_MAIL. Do not activate any other set."
            exit 1
          fi

      - name: Verify the partners rule in INBOUND_MAIL
        run: |
          aws ses describe-receipt-rule-set --rule-set-name INBOUND_MAIL --region "$AWS_REGION" \
            --query 'Rules[].{Name:Name,Recipients:Recipients,Enabled:Enabled}'
