name: CDK Deploy (manual)

# Deploys the GetTrainMate CDK stack on manual dispatch only.
# Runs from main only: the OIDC role GetTrainMateGitHubGrowth trusts
# refs/heads/main (a branch run fails AssumeRoleWithWebIdentity).
#
# DO NOT run this until the IAM grant in docs/growth/PARTNER-OUTREACH-INFRA.md
# (Deployment runbook) is attached to the OIDC role. The role currently
# cannot do CloudFormation / IAM / Route53 / SES / S3 writes, so the deploy
# will fail on permissions until the grant is in place. That failure is
# expected and is not a code problem — get the grant first.
#
# Inputs:
# - route53_hosted_zone_id: Route53 hosted zone ID for gettrainmate.com
#   (Route53 console -> Hosted zones). Empty = DNS records are skipped
#   (SES/S3/Lambda still deploy); supply it to create the MX/SPF/DMARC rows.

on:
  workflow_dispatch:
    inputs:
      route53_hosted_zone_id:
        description: 'Route53 hosted zone ID for gettrainmate.com (empty = skip DNS records)'
        type: string
        default: ''
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: us-east-1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install CDK dependencies
        run: cd infra && npm install

      - name: Build CDK
        run: npm run infra:build

      - name: Configure AWS credentials (OIDC role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GROWTH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy CDK stack (partner outreach infra enabled)
        run: |
          CTX="--context enablePartnerOutreachInfra=true"
          if [ -n "${{ inputs.route53_hosted_zone_id }}" ]; then
            CTX="$CTX --context route53HostedZoneId=${{ inputs.route53_hosted_zone_id }}"
          fi
          # A human explicitly dispatched this run; do not prompt for approvals.
          npx cdk deploy $CTX --require-approval never
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: us-east-1

      - name: Check the currently active SES receipt rule set
        run: |
          set -uo pipefail
          ACTIVE=$(aws ses describe-active-receipt-rule-set --region "$AWS_REGION" \
            --query 'Metadata.Name' --output text 2>/dev/null || echo "NONE")
          echo "ACTIVE_RULE_SET=$ACTIVE"
          if [ "$ACTIVE" != "None" ] && [ -n "$ACTIVE" ]; then
            echo "ERROR: an SES receipt rule set is already active ($ACTIVE)."
            echo "Activating gettrainmate-partner-inbound would replace it. Stop and decide manually."
            exit 1
          fi

      - name: Activate the partner inbound receipt rule set
        run: |
          aws ses set-active-receipt-rule-set \
            --rule-set-name gettrainmate-partner-inbound \
            --region "$AWS_REGION"
          aws ses describe-active-receipt-rule-set --region "$AWS_REGION"

      - name: Verify the receipt rule set
        run: |
          aws ses describe-receipt-rule-set --rule-set-name gettrainmate-partner-inbound --region "$AWS_REGION" \
            --query 'Rules[].{Name:Name,Recipients:Recipients,Enabled:Enabled}'
