name: Web Build, Test, Deploy & Zip

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'scripts/**'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'scripts/**'
      - '.github/workflows/web.yml'

jobs:
  build-test-zip:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install web dependencies
        run: cd apps/web && npm install

      - name: Lint
        run: npm run web:lint

      - name: Type check
        run: cd apps/web && npm run type-check

      - name: Build
        run: npm run web:build

      - name: Test
        run: cd apps/web && npm run test

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Zip (Lambda API)
        run: bash scripts/build-lambda-zip.sh

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/dist

      - name: Upload Lambda zip
        uses: actions/upload-artifact@v4
        with:
          name: lambda-zip
          path: deploy/gettrainmate-api-lambda.zip
