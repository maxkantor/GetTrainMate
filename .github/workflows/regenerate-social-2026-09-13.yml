name: Regenerate GetTrainMate social 2026-09-13

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/regenerate-social-2026-09-13.yml'
      - 'scripts/growth/lib/social-image-photo-compose.mjs'
      - 'scripts/growth/lib/social-image-stock.mjs'
      - 'scripts/growth/lib/social-image-bedrock.mjs'

permissions:
  contents: read
  id-token: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install dependencies without lifecycle hooks
        run: npm ci --ignore-scripts
      - name: Syntax checks
        run: |
          node --check scripts/growth/lib/social-image-photo-compose.mjs
          node --check scripts/growth/lib/social-image-stock.mjs
          node --check scripts/growth/lib/social-image-bedrock.mjs
          node --check scripts/growth/publish-owned-social.mjs
      - name: Regression tests
        run: node --test scripts/growth/tests/social-image.test.mjs scripts/growth/tests/social-copy.test.mjs
      - name: Generate corrected creative without publishing
        run: node scripts/growth/publish-owned-social.mjs --dry-run --skip-instagram
      - name: Assume growth AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::718522948657:role/GoHyroxGitHubGrowth
          aws-region: us-east-1
      - name: Verify GetTrainMate Meta parameters are accessible
        shell: bash
        run: |
          set -euo pipefail
          aws ssm get-parameter --name /gettrainmate/growth/meta-page-access-token --with-decryption --query Parameter.Name --output text >/dev/null
          aws ssm get-parameter --name /gettrainmate/growth/facebook-page-id --query Parameter.Name --output text >/dev/null
      - name: Publish corrected Facebook post only
        run: node scripts/growth/publish-owned-social.mjs --force-publish --skip-instagram
