name: Daily Growth Automation

on:
  # Schedule DISABLED — Cursor Automation is the primary daily runner.
  # Multiple 10:00 ET schedules (Cursor + Windows + Actions) caused triple Admin emails (2026-10-27).
  # Keep workflow_dispatch for manual recovery only.
  workflow_dispatch:
    # To re-enable GitHub as sole runner, restore:
    # schedule:
    #   - cron: '0 14 * * *'

jobs:
  growth:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install growth dependencies
        run: |
          npm --prefix scripts/growth install --ignore-scripts

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Run Daily Growth
        run: node scripts/growth/run-weekday-growth.mjs

      - name: Commit and push updated artifacts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/growth
          if ! git diff --staged --quiet; then
            git commit -m "chore(growth): daily publish snapshot [github-action]"
            git push origin main
          fi
