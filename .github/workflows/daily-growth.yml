name: Daily Growth Automation

on:
  schedule:
    # Cloud BACKUP for Cursor Automation (primary: daily 10:00 America/New_York).
    # Same pattern as YouTubeBooster: offset after Cursor so usage-limit / cloud-agent
    # failures still produce owned-social + Admin email. S3 day guard dedupes if Cursor
    # or Windows already finished.
    # 14:30 UTC ≈ 10:30 AM EDT; 15:30 UTC ≈ 10:30 AM EST.
    - cron: '30 14 * * *'
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no live social publish / Admin email)'
        type: boolean
        default: false
      skip_social:
        description: 'Skip owned-social publish'
        type: boolean
        default: false

jobs:
  growth:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install growth dependencies
        run: |
          npm --prefix scripts/growth install --ignore-scripts

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Run Daily Growth
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.skip_social }}" = "true" ]; then ARGS="$ARGS --skip-social"; fi
          node scripts/growth/run-weekday-growth.mjs $ARGS

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: growth-run-logs-${{ github.run_id }}
          path: |
            docs/growth/logs/
            docs/growth/owned-social/published-log.json
          if-no-files-found: ignore

      - name: Commit and push updated artifacts
        if: always() && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/growth
          if ! git diff --staged --quiet; then
            git commit -m "chore(growth): daily publish snapshot [github-action]"
            git push origin main
          fi
