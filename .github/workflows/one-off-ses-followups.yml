# One-off SES follow-ups for the four Nov 19 Gmail sends (approved by Max Nov 23).
# Manual dispatch ONLY. No schedule. Sends exactly four emails, then ends.
# Uses the existing verified SES identities; no repo code changes.
name: One-off SES follow-ups (Nov 19 sends)

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  send-followups:
    name: Send four approved follow-ups
    if: github.repository == 'maxkantor/GetTrainMate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Configure AWS credentials (OIDC role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GROWTH_ROLE_ARN }}
          aws-region: us-east-1

      - name: Send follow-up 1 — Ace Pickleball Knoxville (GTM)
        env:
          SES_SOURCE: noreply@gettrainmate.com
          SES_REPLY_TO: partners@gettrainmate.com
          SES_TO: KnoxvilleTN@acepickleballclub.com
          SES_SUBJECT: "Re: A free way for Ace members to find a doubles partner"
          SES_BODY: |
            Hi Ace Pickleball team,

            Following up on my email last Wednesday (Nov 19) — I run GetTrainMate (gettrainmate.com), an app that helps active people find a training partner at their level, for the activity they actually do.

            For your Knoxville members, the offer is simple and free to start: a way to find a doubles or drilling partner before they arrive, matched by level and availability, and to chat and arrange the game in the app. It's free to join (3 free credits, no subscription).

            Would a 15-minute call next week still be worth a try — for example, a GetTrainMate invite link for members who want a regular partner, with no cost and no commitment from the club? If it's not a fit, just say so and I'll close the loop.

            Thanks for your time,
            Max Kantor, GetTrainMate — gettrainmate.com
        run: |
          python3 - <<'PY'
          import json, os
          msg = {"Subject": {"Data": os.environ["SES_SUBJECT"]},
                 "Body": {"Text": {"Data": os.environ["SES_BODY"]}}}
          dest = {"ToAddresses": [os.environ["SES_TO"]]}
          open("msg.json", "w").write(json.dumps(msg))
          open("dest.json", "w").write(json.dumps(dest))
          PY
          aws ses send-email --region us-east-1 \
            --source "$SES_SOURCE" \
            --reply-to-addresses "$SES_REPLY_TO" \
            --destination file://dest.json \
            --message file://msg.json

      - name: Send follow-up 2 — Chicken N Pickle (GTM)
        env:
          SES_SOURCE: noreply@gettrainmate.com
          SES_REPLY_TO: partners@gettrainmate.com
          SES_TO: info@chickennpickle.com
          SES_SUBJECT: "Re: A free way for Chicken N Pickle players to find a regular partner"
          SES_BODY: |
            Hi Chicken N Pickle team,

            Following up on my email last Wednesday (Nov 19) — I run GetTrainMate (gettrainmate.com), an app that helps active people find a training partner at their level, for the activity they actually do.

            For your players, the offer is simple and free to start: a way to find a doubles or drilling partner matched by level and availability, and to chat and arrange the game in the app. It's free to join (3 free credits, no subscription).

            Would a 15-minute call next week still be worth a try — for example, a GetTrainMate invite link for members who want a regular partner, with no cost and no commitment from the club? If it's not a fit, just say so and I'll close the loop.

            Thanks for your time,
            Max Kantor, GetTrainMate — gettrainmate.com
        run: |
          python3 - <<'PY'
          import json, os
          msg = {"Subject": {"Data": os.environ["SES_SUBJECT"]},
                 "Body": {"Text": {"Data": os.environ["SES_BODY"]}}}
          dest = {"ToAddresses": [os.environ["SES_TO"]]}
          open("msg.json", "w").write(json.dumps(msg))
          open("dest.json", "w").write(json.dumps(dest))
          PY
          aws ses send-email --region us-east-1 \
            --source "$SES_SOURCE" \
            --reply-to-addresses "$SES_REPLY_TO" \
            --destination file://dest.json \
            --message file://msg.json

      - name: Send follow-up 3 — Carbon Performance Atlanta (HRW)
        env:
          SES_SOURCE: noreply@hybridraceworkouts.com
          SES_REPLY_TO: mykantor@bellsouth.net
          SES_TO: Atlanta@carbonperformance.com
          SES_SUBJECT: "Re: A free printable HYROX workout card for your Atlanta classes"
          SES_BODY: |
            Hi Carbon Performance team,

            Following up on my email last Wednesday (Nov 19) — I run HybridRaceWorkouts, a HYROX-style workout generator at hybridraceworkouts.com.

            The offer still stands, free with no strings: a printable race-paced station workout card your members can take onto the gym floor, with a QR code to generate 3 free workouts — no login, no credit card required. I can make the first card for your members this week, with Carbon Performance named on it.

            Would you like me to send you a sample card to look at? If it's not a fit, just say so and I'll close the loop.

            Max Kantor, HybridRaceWorkouts — hybridraceworkouts.com
        run: |
          python3 - <<'PY'
          import json, os
          msg = {"Subject": {"Data": os.environ["SES_SUBJECT"]},
                 "Body": {"Text": {"Data": os.environ["SES_BODY"]}}}
          dest = {"ToAddresses": [os.environ["SES_TO"]]}
          open("msg.json", "w").write(json.dumps(msg))
          open("dest.json", "w").write(json.dumps(dest))
          PY
          aws ses send-email --region us-east-1 \
            --source "$SES_SOURCE" \
            --reply-to-addresses "$SES_REPLY_TO" \
            --destination file://dest.json \
            --message file://msg.json

