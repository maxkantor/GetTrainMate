          dest = {"ToAddresses": [os.environ["SES_TO"]]}
          open("msg.json", "w").write(json.dumps(msg))
          open("dest.json", "w").write(json.dumps(dest))
          PY
          aws ses send-email --region us-east-1 \
            --source "$SES_SOURCE" \
            --reply-to-addresses "$SES_REPLY_TO" \
            --destination file://dest.json \
            --message file://msg.json
