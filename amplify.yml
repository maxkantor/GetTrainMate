version: 1
# AWS Amplify config for GetTrainMate web app
# Auto-deployed on every push to main branch
#
# Production (https://gettrainmate.com): set branch environment variables in Amplify Console, e.g.:
#   VITE_PUBLIC_SITE_URL=https://gettrainmate.com
#   VITE_API_URL=https://YOUR_API_ID.execute-api.us-east-1.amazonaws.com
#   VITE_COGNITO_USER_POOL_ID / VITE_COGNITO_CLIENT_ID (same pool as production users)
# See docs/PRODUCTION_DOMAIN.md for Cognito callbacks, Stripe, and www→apex redirect.
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --ignore-scripts
    build:
      commands:
        - VITE_API_URL="${VITE_API_URL//us-cast-1/us-east-1}" npm run web:build
  artifacts:
    baseDirectory: apps/web/dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - apps/web/node_modules/**/*
      - ~/.npm/**/*
  customRedirects:
    - source: '/app/<*>'
      target: '/index.html'
      status: '200'
    - source: '/admin/<*>'
      target: '/index.html'
      status: '200'
    - source: '/<*>'
      target: '/index.html'
      status: '200'