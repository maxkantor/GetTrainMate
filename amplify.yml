version: 1
# AWS Amplify config for GetTrainMate web app
# Auto-deployed on every push to main branch
#
# Production (https://gettrainmate.com): set branch environment variables in Amplify Console, e.g.:
#   VITE_PUBLIC_SITE_URL=https://gettrainmate.com
#   VITE_API_URL=https://YOUR_API_ID.execute-api.us-east-1.amazonaws.com
#   VITE_COGNITO_USER_POOL_ID / VITE_COGNITO_CLIENT_ID (same pool as production users)
#   VITE_GA_MEASUREMENT_ID=G-xxxxxxxxxx (GA4 — required for analytics; set in Amplify, not hardcoded in app)
#   VITE_GSC_VERIFICATION=xxxxx (Search Console HTML meta content value — optional if DNS-verified)
#   WORLD_CUP_SEO=true|false (default true) — when false, build omits WC sitemap/prerender shells
#     After the tournament: set WORLD_CUP_SEO=false, apply deploy/amplify-custom-rules-wc-retired.json
#     (301 /world-cup* → /), then redeploy. Marketing SEO (/pricing, /about, …) stays unchanged.
# See docs/PRODUCTION_DOMAIN.md and docs/SEO-Analytics.md (World Cup retirement).
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --ignore-scripts
    build:
      commands:
        - WORLD_CUP_SEO="${WORLD_CUP_SEO:-true}" VITE_WORLD_CUP_SEO="${WORLD_CUP_SEO:-true}" VITE_API_URL="${VITE_API_URL//us-cast-1/us-east-1}" npm run web:build
  artifacts:
    baseDirectory: apps/web/dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - apps/web/node_modules/**/*
      - ~/.npm/**/*
# Redirects must live at amplify.yml root (customRules). Order matters.
# 1) 301 short /go/:code + legacy partner paths (fix GSC "Page with redirect" / duplicates)
# 2) App/admin/auth SPA shells
# 3) Prerendered marketing/WC routes → nested index.html
# 4) Unknown URLs → 404.html (true 404 — not soft-404 homepage)
customRules:
  # Owned-social short links → destination landings (query string preserved by Amplify)
  - source: '/go/t'
    target: '/workout-partner'
    status: '301'
  - source: '/go/train'
    target: '/workout-partner'
    status: '301'
  - source: '/go/v'
    target: '/meet-people'
    status: '301'
  - source: '/go/vibe'
    target: '/meet-people'
    status: '301'
  - source: '/go/d'
    target: '/active-dating'
    status: '301'
  - source: '/go/date'
    target: '/active-dating'
    status: '301'
  - source: '/go/sf'
    target: '/san-francisco'
    status: '301'
  - source: '/go/signup'
    target: '/signup'
    status: '301'
  - source: '/go/ig'
    target: '/go'
    status: '301'
  - source: '/go/fb'
    target: '/go'
    status: '301'
  - source: '/go/<*>'
    target: '/go'
    status: '301'
  # Legacy partner paths → canonical /partners/us/atlanta shape (301, GSC de-dup)
  - source: '/partners/atlanta'
    target: '/partners/us/atlanta'
    status: '301'
  - source: '/partners/atlanta/<*>'
    target: '/partners/us/atlanta/<*>'
    status: '301'
  # App/admin/auth SPA shells (200 rewrite to SPA index)
  - source: '/app'
    target: '/index.html'
    status: '200'
  - source: '/app/<*>'
    target: '/index.html'
    status: '200'
  - source: '/admin'
    target: '/index.html'
    status: '200'
  - source: '/admin/<*>'
    target: '/index.html'
    status: '200'
  - source: '/login'
    target: '/index.html'
    status: '200'
  - source: '/signup'
    target: '/index.html'
    status: '200'
  - source: '/forgot-password'
    target: '/index.html'
    status: '200'
  - source: '/verify-email'
    target: '/index.html'
    status: '200'
  - source: '/billing/<*>'
    target: '/index.html'
    status: '200'
  - source: '/email/unsubscribed'
    target: '/index.html'
    status: '200'
  - source: '/email/unsubscribe'
    target: '/index.html'
    status: '200'
  - source: '/gear'
    target: '/index.html'
    status: '200'
  # "How it works" is a landing-page section (#how-it-works); serve the SPA shell so the Router redirect runs instead of the 404.html rule.
  - source: '/how-it-works'
    target: '/index.html'
    status: '200'
  # Prerendered marketing pages (200 → nested index.html) — SEO, no JS fetch needed
  - source: '/pricing'
    target: '/pricing/index.html'
    status: '200'
  - source: '/about'
    target: '/about/index.html'
    status: '200'
  - source: '/workout-partner'
    target: '/workout-partner/index.html'
    status: '200'
  - source: '/meet-people'
    target: '/meet-people/index.html'
    status: '200'
  - source: '/active-dating'
    target: '/active-dating/index.html'
    status: '200'
  - source: '/atlanta-training-partners'
    target: '/atlanta-training-partners/index.html'
    status: '200'
  - source: '/san-francisco'
    target: '/san-francisco/index.html'
    status: '200'
  - source: '/go'
    target: '/go/index.html'
    status: '200'
  - source: '/partners/us/atlanta'
    target: '/partners/us/atlanta/index.html'
    status: '200'
  - source: '/partners/us/atlanta/atl-track-club'
    target: '/partners/us/atlanta/atl-track-club/index.html'
    status: '200'
  - source: '/partners/us/atlanta/atl-f3'
    target: '/partners/us/atlanta/atl-f3/index.html'
    status: '200'
  # Any other /partners/* market is an SPA route — serve the app shell so the partner hub/landing pages render (e.g. /partners/au/melbourne). Keep AFTER the prerendered Atlanta rules above so Atlanta keeps its prerendered shell.
  - source: '/partners/<*>'
    target: '/index.html'
    status: '200'
  - source: '/invite'
    target: '/invite/index.html'
    status: '200'
  - source: '/invite/<*>'
    target: '/index.html'
    status: '200'
  - source: '/faq'
    target: '/faq/index.html'
    status: '200'
  - source: '/contact'
    target: '/contact/index.html'
    status: '200'
  - source: '/platform'
    target: '/platform/index.html'
    status: '200'
  - source: '/privacy'
    target: '/privacy/index.html'
    status: '200'
  - source: '/terms'
    target: '/terms/index.html'
    status: '200'
  - source: '/world-cup'
    target: '/world-cup/index.html'
    status: '200'
  - source: '/events/world-cup-2026'
    target: '/events/world-cup-2026/index.html'
    status: '200'
  - source: '/world-cup/team/<teamId>'
    target: '/index.html'
    status: '200'
  # True 404 for everything else (not a soft-404 homepage)
  - source: '</^[^.]+$|\.(?!(css|gif|ico|jpg|jpeg|png|svg|js|mjs|map|json|txt|xml|html|webmanifest|woff|woff2|ttf|eot|mp4|webm|ogg|webp)$)([^.]+$)/>'
    target: '/404.html'
    status: '404'
