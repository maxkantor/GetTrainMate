<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google tag (gtag.js) GA4 — load in HTML so collection works even if Vite env vars are missing in Amplify -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-C29M8NWNY4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', 'G-C29M8NWNY4', {
        send_page_view: true,
      });
      window.__GTM_GA4_HTML_INIT__ = true;
    </script>
    <meta name="theme-color" content="%THEME_COLOR%" />
    %GSC_META_LINE%
    <title>%OG_TITLE%</title>
    <meta name="description" content="%OG_DESCRIPTION%" />
    %CANONICAL_LINE%
    <meta property="og:title" content="%OG_TITLE%" />
    <meta property="og:description" content="%OG_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%OG_IMAGE_URL%" />
    <meta property="og:image:secure_url" content="%OG_IMAGE_URL%" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    %OG_URL_LINE%
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%OG_TITLE%" />
    <meta name="twitter:description" content="%OG_DESCRIPTION%" />
    <meta name="twitter:image" content="%OG_IMAGE_URL%" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
